[project]
name = "socialhub-backend"
version = "0.1.0"
description = "Social Hub internal Instagram operations backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==6.1.3",
    "djangorestframework==3.18.3",
    "celery[redis]==5.6.2",
    "psycopg[binary]>=3.2,<4",
    "anthropic>=1.0,<2",
    "pydantic>=2.11,<3",
    "Jinja2>=3.1,<4",
    "feedparser>=6.0,<7",
    "openai>=2.0,<3",
    "pillow>=11.0",
    "filetype>=1.2,<2",
    "playwright>=1.50,<2",
    "django-storages[s3]>=1.14,<2",
    "cryptography>=44",
]

# Test-only dependencies, locked separately in requirements-dev.lock (not in the runtime image):
#   uv pip compile pyproject.toml --group dev --python-version 3.14 --generate-hashes \
#       --output-file requirements-dev.lock
[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.9,<5",
    "freezegun>=1.5,<2",
    "moto[s3]>=5.0,<6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "tests.py"]
# Tables come from the models, not the migrations, while other apps' migrations are in flux;
# migrations are checked separately with `makemigrations --check` and `migrate`.
addopts = "--nomigrations -p no:cacheprovider -m 'not live'"
# `pytest -m live` calls real AI providers once (E00-S05); skipped without keys, never in CI.
markers = ["live: calls a real AI provider; needs API keys"]

[tool.ruff]
line-length = 100
target-version = "py312"

