[project]
name = "socialhub-backend"
version = "0.1.0"
description = "Social Hub internal Instagram operations backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==6.1.3",
    "djangorestframework==3.18.3",
    "celery[redis]==5.6.2",
    "psycopg[binary]>=3.2,<4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

